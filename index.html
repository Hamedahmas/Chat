<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>پیام‌رسان پیشرفته</title>
  <style>
    body {
      margin: 0;
      font-family: "Vazirmatn", sans-serif;
      background: #f5f6fa;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
    }
    .message {
      max-width: 75%;
      padding: 10px 15px;
      border-radius: 18px;
      margin: 5px 0;
      font-size: 15px;
      line-height: 1.4;
      word-wrap: break-word;
      animation: fadeIn 0.3s ease;
    }
    .sent {
      background: #4a90e2;
      color: white;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }
    .message img, .message video, .message audio {
      max-width: 100%;
      border-radius: 12px;
      margin-top: 5px;
    }
    .download-link {
      display: inline-block;
      margin-top: 5px;
      font-size: 13px;
      color: #fff;
      background: #357abd;
      padding: 5px 10px;
      border-radius: 12px;
      text-decoration: none;
    }
    .input-container {
      display: flex;
      padding: 10px;
      background: white;
      border-top: 1px solid #ddd;
      align-items: center;
    }
    .input-container input[type="text"] {
      flex: 1;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 20px;
      font-size: 15px;
      outline: none;
    }
    .input-container button, .input-container label {
      margin-left: 8px;
      padding: 10px 15px;
      border: none;
      border-radius: 20px;
      background: #4a90e2;
      color: white;
      font-size: 15px;
      cursor: pointer;
      transition: 0.2s;
    }
    .input-container button:hover, .input-container label:hover {
      background: #357abd;
    }
    .input-container input[type="file"] {
      display: none;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="chat-container" id="chat"></div>
  <div class="input-container">
    <input type="text" id="messageInput" placeholder="پیام خود را بنویسید...">
    <label for="fileInput">📎</label>
    <input type="file" id="fileInput" accept="image/*,video/*,audio/*">
    <button id="recordBtn">🎙️</button>
    <button onclick="sendMessage()">ارسال</button>
  </div>

  <script>
    const chat = document.getElementById("chat");
    const input = document.getElementById("messageInput");
    const fileInput = document.getElementById("fileInput");
    const recordBtn = document.getElementById("recordBtn");
    let messages = [];

    let mediaRecorder;
    let audioChunks = [];
    let isRecording = false;

    function sendMessage(content, type = "text") {
      let text = content || input.value.trim();
      if (text === "" && type === "text") return;

      messages.push({ type, content: text });
      if (messages.length > 100) messages.shift();

      renderMessages();
      input.value = "";
      input.focus();
    }

    function renderMessages() {
      chat.innerHTML = "";
      messages.forEach(msg => {
        const div = document.createElement("div");
        div.classList.add("message", "sent");

        if (msg.type === "text") {
          div.innerText = msg.content;
        } else if (msg.type === "image") {
          const img = document.createElement("img");
          img.src = msg.content;
          div.appendChild(img);
        } else if (msg.type === "video") {
          const video = document.createElement("video");
          video.src = msg.content;
          video.controls = true;
          div.appendChild(video);
        } else if (msg.type === "audio") {
          const audio = document.createElement("audio");
          audio.src = msg.content;
          audio.controls = true;
          div.appendChild(audio);

          const link = document.createElement("a");
          link.href = msg.content;
          link.download = "voice-message.webm";
          link.innerText = "دانلود صدا";
          link.classList.add("download-link");
          div.appendChild(link);
        }

        chat.appendChild(div);
      });
      chat.scrollTop = chat.scrollHeight;
    }

    // ارسال با Enter
    input.addEventListener("keypress", function(e) {
      if (e.key === "Enter") sendMessage();
    });

    // فایل انتخاب شد
    fileInput.addEventListener("change", function() {
      const file = fileInput.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        let type = "text";
        if (file.type.startsWith("image")) type = "image";
        else if (file.type.startsWith("video")) type = "video";
        else if (file.type.startsWith("audio")) type = "audio";

        sendMessage(e.target.result, type);
      };
      reader.readAsDataURL(file);
      fileInput.value = "";
    });

    // ضبط صدا
    recordBtn.addEventListener("click", async function() {
      if (!isRecording) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          mediaRecorder = new MediaRecorder(stream);
          audioChunks = [];

          mediaRecorder.ondataavailable = e => {
            audioChunks.push(e.data);
          };

          mediaRecorder.onstop = () => {
            const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
            const audioUrl = URL.createObjectURL(audioBlob);
            sendMessage(audioUrl, "audio");
          };

          mediaRecorder.start();
          recordBtn.textContent = "⏹️";
          isRecording = true;
        } catch (err) {
          alert("دسترسی به میکروفون رد شد!");
        }
      } else {
        mediaRecorder.stop();
        recordBtn.textContent = "🎙️";
        isRecording = false;
      }
    });
  </script>
</body>
</html>
